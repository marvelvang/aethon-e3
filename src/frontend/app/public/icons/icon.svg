  <!-- Window lights on main tower right -->
  <rect x="290" y="250" width="14" height="10" rx="2" fill="#c8baff" opacity="0.7"/>
  <rect x="314" y="265" width="14" height="10" rx="2" fill="#c8baff" opacity="0.5"/>
  <rect x="290" y="278" width="14" height="10" rx="2" fill="#c8baff" opacity="0.6"/>

  <!-- Window lights on main tower left -->
  <rect x="208" y="250" width="14" height="10" rx="2" fill="#c8baff" opacity="0.7"/>
  <rect x="184" y="265" width="14" height="10" rx="2" fill="#c8baff" opacity="0.5"/>
  <rect x="208" y="278" width="14" height="10" rx="2" fill="#c8baff" opacity="0.6"/>
</svg>
