  <!-- Main tower: right face -->
  <polygon points="366,172 366,310 256,372 256,234" fill="#3a2c9e"/>
  <!-- Main tower: left face -->
  <polygon points="146,172 146,310 256,372 256,234" fill="#4a39b8"/>

  <!-- Left building: top face -->
  <polygon points="152,300 212,268 212,300 152,332" fill="#3a2c9e"/>
  <polygon points="152,300 212,268 256,290 196,322" fill="#5040cc"/>

  <!-- Right building: top face -->
  <polygon points="360,300 300,268 300,300 360,332" fill="#3a2c9e"/>
  <polygon points="360,300 300,268 256,290 316,322" fill="#5040cc"/>

  <!-- Accent glow on tower top -->
