<?xml version="1.0" encoding="UTF-8"?>
<!--
  Amber Stack T2 – Housing Tier 2 (Master SVG, 4× tile resolution)
  Tile: 64×32 px at 1× → SVG: 256×308 px (4×)
  Anchor: sprite.anchor.set(0.5, 178/308)
  Scale:  sprite.scale.set(64/256)

  Geometry:
    Foundation  hz 0→24    footprint ±128
    Block A     hz 24→88   footprint ±88   (lower residential, 2×2 windows)
    Block B     hz 88→148  footprint ±68   (middle residential, 2×1 windows)  ← new
    Block C     hz 148→190 footprint ±48   (upper residential, 1×1 windows)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-128 -178 256 308"
     width="256" height="308">
  <defs>
    <!-- Foundation -->
    <linearGradient id="fR" gradientUnits="userSpaceOnUse" x1="128" y1="40" x2="0" y2="104">
      <stop offset="0%"   stop-color="#8a3818"/>
      <stop offset="100%" stop-color="#4a1c0c"/>
    </linearGradient>
    <linearGradient id="fL" gradientUnits="userSpaceOnUse" x1="-128" y1="40" x2="0" y2="104">
      <stop offset="0%"   stop-color="#2a1008"/>
      <stop offset="100%" stop-color="#100604"/>
    </linearGradient>
    <linearGradient id="fT" gradientUnits="userSpaceOnUse" x1="0" y1="-24" x2="0" y2="104">
      <stop offset="0%"   stop-color="#b04820"/>
      <stop offset="100%" stop-color="#7a3010"/>
    </linearGradient>

    <!-- Block A – lower residential (±88) -->
    <linearGradient id="aR" gradientUnits="userSpaceOnUse" x1="88" y1="16" x2="0" y2="-44">
      <stop offset="0%"   stop-color="#c05828"/>
      <stop offset="60%"  stop-color="#8c3a18"/>
      <stop offset="100%" stop-color="#5c2008"/>
    </linearGradient>
    <linearGradient id="aL" gradientUnits="userSpaceOnUse" x1="-88" y1="16" x2="0" y2="-44">
      <stop offset="0%"   stop-color="#3a1208"/>
      <stop offset="100%" stop-color="#120604"/>
    </linearGradient>
    <linearGradient id="aT" gradientUnits="userSpaceOnUse" x1="0" y1="-92" x2="0" y2="-4">
      <stop offset="0%"   stop-color="#e07030"/>
      <stop offset="100%" stop-color="#a84820"/>
    </linearGradient>

    <!-- Window – lit (right face) -->
    <radialGradient id="winW" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fff8c0"/>
      <stop offset="40%"  stop-color="#ffcc44"/>
      <stop offset="100%" stop-color="#aa6600"/>
    </radialGradient>
    <!-- Window – dim (left face) -->
    <radialGradient id="winD" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#cc9922"/>
      <stop offset="100%" stop-color="#442200"/>
    </radialGradient>

    <!-- Block C – upper residential (±48) – same shape as T1 Block B -->
    <linearGradient id="cR" gradientUnits="userSpaceOnUse" x1="48" y1="-24" x2="0" y2="-66">
      <stop offset="0%"   stop-color="#d86830"/>
      <stop offset="50%"  stop-color="#a84a20"/>
      <stop offset="100%" stop-color="#7c3010"/>
    </linearGradient>
    <linearGradient id="cL" gradientUnits="userSpaceOnUse" x1="-48" y1="-24" x2="0" y2="-66">
      <stop offset="0%"   stop-color="#2a0e04"/>
      <stop offset="100%" stop-color="#0c0402"/>
    </linearGradient>
    <linearGradient id="cT" gradientUnits="userSpaceOnUse" x1="0" y1="-90" x2="0" y2="-42">
      <stop offset="0%"   stop-color="#f07840"/>
      <stop offset="100%" stop-color="#c05a28"/>
    </linearGradient>

    <!-- Roof dish face gradients -->
    <radialGradient id="dishAmber" cx="35%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ffe088"/>
      <stop offset="50%"  stop-color="#cc7720"/>
      <stop offset="100%" stop-color="#7a3808"/>
    </radialGradient>
    <radialGradient id="dishAmberD" cx="35%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#996622"/>
      <stop offset="100%" stop-color="#3a1a04"/>
    </radialGradient>

    <!-- Block B – middle residential (±68) -->
    <linearGradient id="bR" gradientUnits="userSpaceOnUse" x1="68" y1="-34" x2="0" y2="-60">
      <stop offset="0%"   stop-color="#c86030"/>
      <stop offset="60%"  stop-color="#8c3c1a"/>
      <stop offset="100%" stop-color="#602010"/>
    </linearGradient>
    <linearGradient id="bL" gradientUnits="userSpaceOnUse" x1="-68" y1="-34" x2="0" y2="-60">
      <stop offset="0%"   stop-color="#3c1408"/>
      <stop offset="100%" stop-color="#140804"/>
    </linearGradient>
    <linearGradient id="bT" gradientUnits="userSpaceOnUse" x1="0" y1="-128" x2="0" y2="-60">
      <stop offset="0%"   stop-color="#e87838"/>
      <stop offset="100%" stop-color="#b05028"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══ FOUNDATION  hz 0→24  (±128) ══ -->
  <polygon points="-128,64 0,128 0,104 -128,40" fill="url(#fL)" stroke="#cc5500" stroke-width="1.5"/>
  <polygon points="128,64 0,128 0,104 128,40"   fill="url(#fR)" stroke="#cc5500" stroke-width="1.5"/>
  <polygon points="0,-24 128,40 0,104 -128,40"  fill="url(#fT)" stroke="#cc5500" stroke-width="1.5"/>

  <!-- ══ BLOCK A  hz 24→88  (±88) ══ -->
  <g transform="translate(0, 24)">

  <!-- Left face -->
  <polygon points="-88,16 0,60 0,-4 -88,-48"  fill="url(#aL)" stroke="#cc5500" stroke-width="1.5"/>
  <line x1="-88" y1="16" x2="-88" y2="-48" stroke="#3a1208" stroke-width="2" opacity="0.5"/>

  <!-- Left face: bottom-outer window -->
  <polygon points="-78.1,13.45 -53.9,25.55 -53.9,8.55 -78.1,-3.55"  fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.75"/>
  <line x1="-66"   y1="2.5"   x2="-66"   y2="19.5"  stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-78.1" y1="4.95"  x2="-53.9" y2="17.05" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Left face: bottom-inner window -->
  <polygon points="-34.1,35.45 -9.9,47.55 -9.9,30.55 -34.1,18.45"  fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.75"/>
  <line x1="-22"   y1="24.5"  x2="-22"   y2="41.5"  stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-34.1" y1="26.95" x2="-9.9"  y2="39.05" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Left face: top-outer window -->
  <polygon points="-78.1,-18.55 -53.9,-6.45 -53.9,-23.45 -78.1,-35.55" fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.75"/>
  <line x1="-66"   y1="-29.5"  x2="-66"   y2="-12.5"  stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-78.1" y1="-27.05" x2="-53.9" y2="-14.95" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Left face: top-inner window -->
  <polygon points="-34.1,3.45 -9.9,15.55 -9.9,-1.45 -34.1,-13.55"  fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.75"/>
  <line x1="-22"   y1="-7.5"  x2="-22"   y2="9.5"  stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-34.1" y1="-5.05" x2="-9.9"  y2="7.05" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Right face -->
  <polygon points="88,16 0,60 0,-4 88,-48"    fill="url(#aR)" stroke="#cc5500" stroke-width="1.5"/>
  <line x1="88" y1="16" x2="88" y2="-48" stroke="#e07030" stroke-width="2" opacity="0.6"/>

  <!-- Right face: bottom-outer window -->
  <polygon points="78.1,13.45 53.9,25.55 53.9,8.55 78.1,-3.55"   fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="66"   y1="2.5"   x2="66"   y2="19.5"  stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="78.1" y1="4.95"  x2="53.9" y2="17.05" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Right face: bottom-inner window -->
  <polygon points="34.1,35.45 9.9,47.55 9.9,30.55 34.1,18.45"    fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="22"   y1="24.5"  x2="22"   y2="41.5"  stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="34.1" y1="26.95" x2="9.9"  y2="39.05" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Right face: top-outer window -->
  <polygon points="78.1,-18.55 53.9,-6.45 53.9,-23.45 78.1,-35.55"  fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="66"   y1="-29.5"  x2="66"   y2="-12.5"  stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="78.1" y1="-27.05" x2="53.9" y2="-14.95" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Right face: top-inner window -->
  <polygon points="34.1,3.45 9.9,15.55 9.9,-1.45 34.1,-13.55"     fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="22"   y1="-7.5"  x2="22"   y2="9.5"  stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="34.1" y1="-5.05" x2="9.9"  y2="7.05" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Block A top face -->
  <polygon points="0,-92 88,-48 0,-4 -88,-48" fill="url(#aT)" stroke="#cc5500" stroke-width="1.5"/>

  <!-- Panel dividers (cross) -->
  <line x1="44"  y1="-26" x2="44"  y2="38"  stroke="#ff8c00" stroke-width="2"   opacity="0.75"/>
  <line x1="-44" y1="-26" x2="-44" y2="38"  stroke="#aa4400" stroke-width="1.5" opacity="0.4"/>
  <line x1="88"  y1="-16" x2="0"   y2="28"  stroke="#ff8c00" stroke-width="2"   opacity="0.75"/>
  <line x1="0"   y1="28"  x2="-88" y2="-16" stroke="#aa4400" stroke-width="1.5" opacity="0.4"/>

  <!-- Terrace corner lights -->
  <circle cx="88"  cy="-48" r="5" fill="#ffaa00" filter="url(#glow)"/>
  <circle cx="-88" cy="-48" r="5" fill="#ff8c00" filter="url(#glow)" opacity="0.65"/>
  <circle cx="0"   cy="-4"  r="5" fill="#ffaa00" filter="url(#glow)"/>

  </g>

  <!-- ══ BLOCK B  hz 88→148  (±68) ══ -->
  <!-- translate(0,10): local front-bottom=(0,0), screen front-bottom=(0,10)  -->
  <!-- Centered on Block A: inset 20 3D units on all sides (88−68=20)        -->
  <!-- Top face local: N(0,−128) E(68,−94) S(0,−60) W(−68,−94)              -->
  <g transform="translate(0, 10)">

  <!-- Left face -->
  <polygon points="-68,-34 0,0 0,-60 -68,-94" fill="url(#bL)" stroke="#cc5500" stroke-width="1.5"/>
  <line x1="-68" y1="-34" x2="-68" y2="-94" stroke="#3c1408" stroke-width="1.5" opacity="0.5"/>

  <!-- Left face: outer window (dim) -->
  <polygon points="-44,-40 -62,-49 -62,-73 -44,-64" fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.75"/>
  <line x1="-53" y1="-44.5" x2="-53" y2="-68.5" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-44" y1="-52"   x2="-62" y2="-61"   stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Left face: inner window (dim) -->
  <polygon points="-6,-21 -24,-30 -24,-54 -6,-45" fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.75"/>
  <line x1="-15" y1="-25.5" x2="-15" y2="-49.5" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-6"  y1="-33"   x2="-24" y2="-42"   stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Right face -->
  <polygon points="68,-34 0,0 0,-60 68,-94" fill="url(#bR)" stroke="#cc5500" stroke-width="1.5"/>
  <line x1="68" y1="-34" x2="68" y2="-94" stroke="#e07030" stroke-width="1.5" opacity="0.6"/>

  <!-- Right face: outer window (lit) -->
  <polygon points="44,-40 62,-49 62,-73 44,-64" fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="53" y1="-44.5" x2="53" y2="-68.5" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="44" y1="-52"   x2="62" y2="-61"   stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Right face: inner window (lit) -->
  <polygon points="6,-21 24,-30 24,-54 6,-45" fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="15" y1="-25.5" x2="15" y2="-49.5" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="6"  y1="-33"   x2="24" y2="-42"   stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Back corner light (drawn before top face so face occludes lower half) -->
  <circle cx="0" cy="-128" r="4" fill="#ffaa00" filter="url(#glow)" opacity="0.45"/>

  <!-- Block B top face -->
  <polygon points="0,-128 68,-94 0,-60 -68,-94" fill="url(#bT)" stroke="#cc5500" stroke-width="1.5"/>

  <!-- Panel dividers -->
  <line x1="34"  y1="-77" x2="34"  y2="-17" stroke="#ff8c00" stroke-width="1.5" opacity="0.75"/>
  <line x1="-34" y1="-77" x2="-34" y2="-17" stroke="#aa4400" stroke-width="1.5" opacity="0.4"/>

  <!-- Terrace corner lights -->
  <circle cx="68"  cy="-94" r="4" fill="#ffaa00" filter="url(#glow)"/>
  <circle cx="-68" cy="-94" r="4" fill="#ff8c00" filter="url(#glow)" opacity="0.65"/>
  <circle cx="0"   cy="-60" r="4" fill="#ffaa00" filter="url(#glow)"/>

  </g>

  <!-- ══ BLOCK C  hz 148→190  (±48) ══ -->
  <!-- Centered on Block B: inset 20 3D units (68−48=20)              -->
  <!-- translate(0,−60): local front-bottom=(0,0), screen=(0,−60)     -->
  <!-- Top face local: N(0,−90) E(48,−66) S(0,−42) W(−48,−66)        -->
  <g transform="translate(0, -60)">

  <!-- Left face -->
  <polygon points="-48,-24 0,0 0,-42 -48,-66" fill="url(#cL)" stroke="#cc5500" stroke-width="1.5"/>
  <line x1="-48" y1="-24" x2="-48" y2="-66" stroke="#3a1208" stroke-width="1.5" opacity="0.5"/>

  <!-- Left face: outer window (dim) -->
  <polygon points="-44,-35 -28,-27 -28,-43 -44,-51" fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.65"/>
  <line x1="-36" y1="-47" x2="-36" y2="-31" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-44" y1="-43" x2="-28" y2="-35" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Left face: inner window (dim) -->
  <polygon points="-20,-23 -4,-15 -4,-31 -20,-39" fill="url(#winD)" stroke="#884400" stroke-width="1" opacity="0.65"/>
  <line x1="-12" y1="-35" x2="-12" y2="-19" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>
  <line x1="-20" y1="-31" x2="-4"  y2="-23" stroke="#aa6600" stroke-width="0.8" opacity="0.28"/>

  <!-- Right face -->
  <polygon points="48,-24 0,0 0,-42 48,-66" fill="url(#cR)" stroke="#cc5500" stroke-width="1.5"/>
  <line x1="48" y1="-24" x2="48" y2="-66" stroke="#e07030" stroke-width="1.5" opacity="0.55"/>

  <!-- Right face: outer window (lit) -->
  <polygon points="44,-35 28,-27 28,-43 44,-51" fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="36" y1="-47" x2="36" y2="-31" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="44" y1="-43" x2="28" y2="-35" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Right face: inner window (lit) -->
  <polygon points="20,-23 4,-15 4,-31 20,-39" fill="url(#winW)" stroke="#ffaa00" stroke-width="1.2"/>
  <line x1="12" y1="-35" x2="12" y2="-19" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>
  <line x1="20" y1="-31" x2="4"  y2="-23" stroke="#fff8c0" stroke-width="0.8" opacity="0.55"/>

  <!-- Back corner light (before top face) -->
  <circle cx="0" cy="-90" r="4" fill="#ffaa00" filter="url(#glow)" opacity="0.45"/>

  <!-- Block C top face -->
  <polygon points="0,-90 48,-66 0,-42 -48,-66" fill="url(#cT)" stroke="#cc5500" stroke-width="1.5"/>

  <!-- Panel dividers -->
  <line x1="24"  y1="-54" x2="24"  y2="-12" stroke="#ff8c00" stroke-width="1.5" opacity="0.75"/>
  <line x1="-24" y1="-54" x2="-24" y2="-12" stroke="#aa4400" stroke-width="1.5" opacity="0.4"/>

  <!-- Terrace corner lights -->
  <circle cx="48"  cy="-66" r="4" fill="#ffaa00" filter="url(#glow)"/>
  <circle cx="-48" cy="-66" r="4" fill="#ff8c00" filter="url(#glow)" opacity="0.65"/>
  <circle cx="0"   cy="-42" r="4" fill="#ffaa00" filter="url(#glow)"/>

  </g>

  <!-- ══ ROOFTOP: FOUR CORNER DISHES ══ -->
  <!-- Same translate(0,−60) as Block C; painter order N→E→W→S             -->
  <!-- Block C top corners (local): N(0,−90) E(48,−66) W(−48,−66) S(0,−42) -->
  <g transform="translate(0, -60)">

  <!-- N dish – back corner (0,−90), drawn first -->
  <line x1="0" y1="-90" x2="0" y2="-106" stroke="#cc7730" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="0" cy="-106" rx="11" ry="5.5" fill="url(#dishAmber)" stroke="#ffaa00" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="0" cy="-106" rx="6"  ry="3"   fill="#5a2008" stroke="#cc7730" stroke-width="0.8"/>
  <circle  cx="0" cy="-106" r="3"   fill="#ffcc44" opacity="0.9" filter="url(#glow)"/>

  <!-- E dish – right corner (48,−66) -->
  <line x1="48" y1="-66" x2="40" y2="-82" stroke="#cc7730" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="40" cy="-82" rx="10" ry="5"   fill="url(#dishAmber)" stroke="#ffaa00" stroke-width="1.2"/>
  <ellipse cx="40" cy="-82" rx="5.5" ry="2.8" fill="#5a2008" stroke="#cc7730" stroke-width="0.8"/>
  <circle  cx="40" cy="-82" r="3"   fill="#ffcc44" opacity="0.9" filter="url(#glow)"/>

  <!-- W dish – left corner (−48,−66), shadow side -->
  <line x1="-48" y1="-66" x2="-40" y2="-82" stroke="#7a3010" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="-40" cy="-82" rx="10"  ry="5"   fill="url(#dishAmberD)" stroke="#994400" stroke-width="1.2" opacity="0.8"/>
  <ellipse cx="-40" cy="-82" rx="5.5" ry="2.8"  fill="#2a0e04" stroke="#7a3010" stroke-width="0.8" opacity="0.8"/>
  <circle  cx="-40" cy="-82" r="2.5" fill="#cc8822" opacity="0.6" filter="url(#glow)"/>

  <!-- S dish – front corner (0,−42), drawn last -->
  <line x1="0" y1="-42" x2="0" y2="-58" stroke="#cc7730" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="0" cy="-58" rx="11" ry="5.5" fill="url(#dishAmber)" stroke="#ffaa00" stroke-width="1.2"/>
  <ellipse cx="0" cy="-58" rx="6"  ry="3"   fill="#5a2008" stroke="#cc7730" stroke-width="0.8"/>
  <circle  cx="0" cy="-58" r="3"   fill="#ffcc44" opacity="0.9" filter="url(#glow)"/>

  </g>

</svg>
