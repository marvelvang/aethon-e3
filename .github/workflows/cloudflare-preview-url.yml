name: Cloudflare Deploy

on:
  push:
    branches:
      - 'claude/**'
      - 'main'

jobs:
  preview-url:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install cairosvg (for PNG pre-rendering)
        run: pip install cairosvg

      - name: Build frontend
        run: bun run --filter @aethon/frontend build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src/frontend/app/dist --project-name=aethon-e3 --branch=${{ github.ref_name }}

      - name: Output preview URL
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG="${BRANCH//\//-}"
          SLUG="${SLUG,,}"
          if [ "$BRANCH" = "main" ]; then
            echo "CLOUDFLARE_PREVIEW_URL=https://aethon-e3.pages.dev"
          else
            echo "CLOUDFLARE_PREVIEW_URL=https://${SLUG}.aethon-e3.pages.dev"
          fi
